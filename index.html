<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mobile Shop Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon">⌁</span><div><b>MSM</b><small>Mobile Shop Manager</small></div></div>
    <nav id="sideNav"></nav>
    <div class="shop-mini"><span class="avatar">A</span><div><b>AK Mobile Store</b><small>Owner</small></div></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
      <div><span class="eyebrow">SHOP MANAGER</span><h1 id="pageTitle">Dashboard</h1></div>
      <div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn">🔔</button><span class="avatar">A</span></div>
    </header>

    <section id="content"></section>
  </main>

  <button class="fab" id="fab">＋</button>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>
<script src="app.js"></script>
</body>
</html>
